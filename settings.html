<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 增强器 - 设置中心</title>
  <style>
    body {
      background-color: #08090d;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-wrap {
      text-align: center;
    }
    .loading-dot {
      width: 10px;
      height: 10px;
      background: #3b82f6;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <script>
    (function() {
      // 默认使用经典默认主题 (classic-default.html)
      var defaultTheme = 'docs/themes/classic-default.html';
      var currentTheme = localStorage.getItem('agy_theme');

      // 确保目标路径有效合法
      var validThemes = [
        'docs/themes/classic-default.html',
        'docs/themes/aurora-bento.html',
        'docs/themes/cyberpunk.html',
        'docs/themes/swiss-gallery.html',
        'docs/themes/spatial-3d.html',
        'docs/themes/retro-arcade.html'
      ];

      var target = (currentTheme && validThemes.indexOf(currentTheme) !== -1)
        ? currentTheme
        : defaultTheme;

      // 瞬间直达目标主题，不留下多余的历史记录，不加载其他主题任何字节
      location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="loading-wrap">
    <div class="loading-dot"></div>
    <div style="margin-top: 12px; font-size: 13px;">正在启动 Antigravity 设置中心...</div>
  </div>
</body>
</html>
