<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 增强器 - 设置中心</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="alternate icon" type="image/x-icon" href="assets/icon.ico">
  <style>
    body {
      background-color: #08090d;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-wrap {
      text-align: center;
    }
    .loading-dot {
      width: 10px;
      height: 10px;
      background: #3b82f6;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>
  <script>
    (function() {
      var defaultTheme = 'docs/themes/classic-default.html';
      var validThemes = [
        'docs/themes/classic-default.html',
        'docs/themes/aurora-bento.html',
        'docs/themes/cyberpunk.html',
        'docs/themes/swiss-gallery.html',
        'docs/themes/spatial-3d.html',
        'docs/themes/retro-arcade.html'
      ];
      var currentTheme = localStorage.getItem('agy_theme');

      function jumpTo(themePath) {
        var target = (themePath && validThemes.indexOf(themePath) !== -1) ? themePath : defaultTheme;
        location.replace(target);
      }

      var controller = window.AbortController ? new AbortController() : null;
      var timeoutId = setTimeout(function() {
        if (controller) controller.abort();
        jumpTo(currentTheme);
      }, 150);

      var fetchOpt = { cache: 'no-store' };
      if (controller) fetchOpt.signal = controller.signal;

      fetch('http://127.0.0.1:37210/api/config', fetchOpt)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          clearTimeout(timeoutId);
          if (data && data.config && data.config.UI_THEME) {
            var themePath = 'docs/themes/' + data.config.UI_THEME;
            if (validThemes.indexOf(themePath) !== -1) {
              localStorage.setItem('agy_theme', themePath);
              jumpTo(themePath);
              return;
            }
          }
          jumpTo(currentTheme);
        })
        .catch(function() {
          clearTimeout(timeoutId);
          jumpTo(currentTheme);
        });
    })();
  </script>
</head>
<body>
  <div class="loading-wrap">
    <div class="loading-dot"></div>
    <div style="margin-top: 12px; font-size: 13px;">正在启动 Antigravity 设置中心...</div>
  </div>
</body>
</html>
